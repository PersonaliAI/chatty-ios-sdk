name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (SwiftPM)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Swift build
        run: swift build

      # No Tests/ target exists yet (see CONTRIBUTING.md) — `swift test`
      # errors out with "no tests found" rather than passing 0 tests, so
      # skip it until a test target is added instead of failing CI on it.
      - name: Swift test
        run: test -d Tests && swift test || echo "No Tests/ target yet — skipping"

  example-app:
    name: Build example app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build ChattySDKExample for iOS Simulator
        run: |
          xcodebuild build \
            -project Example/ChattySDKExample.xcodeproj \
            -scheme ChattySDKExample \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  lint-podspec:
    name: Lint CocoaPods podspec
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # `pod spec lint` resolves the source from git (the tag in `s.source`),
      # which doesn't exist yet pre-release. `pod lib lint` validates against
      # the local working copy instead, so it works on every push.
      - name: pod lib lint
        run: pod lib lint ChattySDK.podspec --allow-warnings --skip-import-validation
