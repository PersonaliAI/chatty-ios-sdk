name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-xcframework:
    name: Build XCFramework & publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify swift build
        run: swift build -c release

      - name: Archive for iOS device
        run: |
          xcodebuild archive \
            -scheme ChattySDK \
            -destination "generic/platform=iOS" \
            -archivePath build/ChattySDK-iOS \
            -derivedDataPath build/DerivedData-iOS \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            INSTALL_PATH=/Library/Frameworks

      - name: Archive for iOS Simulator
        run: |
          xcodebuild archive \
            -scheme ChattySDK \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/ChattySDK-iOS-Simulator \
            -derivedDataPath build/DerivedData-iOS-Simulator \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            INSTALL_PATH=/Library/Frameworks

      # The exact path xcodebuild places the built .framework at inside the
      # archive varies by Xcode/SPM version, so locate it instead of
      # hardcoding Products/Library/Frameworks/.
      - name: Locate built frameworks
        id: locate
        run: |
          device_fw=$(find build -path "*ChattySDK-iOS.xcarchive*ChattySDK.framework" -type d | head -1)
          sim_fw=$(find build -path "*ChattySDK-iOS-Simulator.xcarchive*ChattySDK.framework" -type d | head -1)
          if [ -z "$device_fw" ] || [ -z "$sim_fw" ]; then
            echo "::error::Could not locate ChattySDK.framework in one or both archives"
            find build -maxdepth 8 \( -type d -o -name "*.framework" \)
            exit 1
          fi
          echo "device_fw=$device_fw" >> "$GITHUB_OUTPUT"
          echo "sim_fw=$sim_fw" >> "$GITHUB_OUTPUT"

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework "${{ steps.locate.outputs.device_fw }}" \
            -framework "${{ steps.locate.outputs.sim_fw }}" \
            -output build/ChattySDK.xcframework

      - name: Zip XCFramework
        run: cd build && zip -r ChattySDK.xcframework.zip ChattySDK.xcframework

      # CocoaPods Trunk publish requires COCOAPODS_TRUNK_TOKEN (from `pod
      # trunk register`) as a repo secret — skipped automatically until set.
      - name: Publish to CocoaPods Trunk
        if: ${{ vars.COCOAPODS_ENABLED == 'true' }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          sudo gem install cocoapods --no-document
          pod trunk push ChattySDK.podspec --allow-warnings

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/ChattySDK.xcframework.zip
